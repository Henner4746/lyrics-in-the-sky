name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build both Minecraft versions and run tests
        run: ./gradlew collectJars --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: lyrics-in-the-sky-jars
          path: build/libs/*.jar
